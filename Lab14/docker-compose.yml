services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - api

  library.web:
    build: ./Library.Web
    container_name: library.web
    ports:
      - "9090:90"
    environment:
      - LibraryWebApiServiceHost=http://library.webapi:91
    networks:
      - api
    depends_on:
      - library.webapi

  library.webapi:
    build: ./Library.WebApi
    container_name: library.webapi
    ports:
      - "9091:91"
    networks:
      - api
    depends_on:
      - rabbitmq

  library.notificationservice2:
    build: ./Library.NotificationService2
    container_name: library.notificationservice2
    ports:
      - "9092:92"
    networks:
      - api
    depends_on:
      - rabbitmq

networks:
  api:
    driver: bridge
